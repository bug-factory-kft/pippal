name: E2E (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  install-surface-smoke:
    name: Install surface smoke
    runs-on: [self-hosted, windows, pippal-windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Every job installs into its OWN fresh venv in the job workspace,
      # created from the setup-python interpreter, and later steps call
      # only $env:PIPPAL_CI_PYTHON. Never pip-install into the runner's
      # shared tool-cache Python: this step's former `--upgrade pytest`
      # there pulled in pytest 9.2 for every later job and broke CI
      # Benchmarks on main (2026-11-09).
      - name: Create job venv + install smoke dependencies
        shell: pwsh
        run: |
          python -m venv --clear .venv-ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $PWD '.venv-ci-smoke\Scripts\python.exe'
          & $python -m pip install --upgrade pip pytest wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PIPPAL_CI_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Run install surface smoke
        shell: pwsh
        run: |
          & $env:PIPPAL_CI_PYTHON -m pytest tests/smoke -q

  e2e:
    name: Synth pipeline E2E
    # Self-hosted Windows runner (headless service, Session 0). Tray
    # / Tk / hotkey hook can't run in this session — those need a
    # logged-in interactive runner. What works headless: the synth
    # subprocess + WAV file inspection, which is the highest-value
    # bit anyway.
    runs-on: [self-hosted, windows, pippal-windows]

    env:
      PIPER_VERSION: "2023.11.14-2"
      VOICE: "en_US-ljspeech-high.onnx"
      VOICE_NAME: "ljspeech"
      VOICE_QUALITY: "high"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # piper.exe + the test voice live in a RUNNER-LOCAL cache, never in
      # GitHub Actions cache (BugFactory contract: caches stay on the owned
      # runner). It sits in the runner's own _work root, outside the job
      # workspace, so every runner carrying `pippal-windows` keeps its own
      # copy and a runner runs one job at a time (no locking needed). Same
      # key as the former actions/cache entry. A miss downloads into a
      # staging dir with retries (a github.com 504 broke a cold run),
      # checks the set, and only then renames it into place, so an
      # interrupted fill is never mistaken for a hit. The tests only read
      # these files, so they use the cache in place (no copy onto C:).
      - name: Restore piper binary + voice (runner-local cache)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is not set' }
          $key = "piper-$env:PIPER_VERSION-$env:VOICE-v1"
          $root = Join-Path (Split-Path -Parent $env:RUNNER_TEMP) '_pippal-e2e-cache'
          $entry = Join-Path $root $key
          function Test-PiperSet([string]$dir) {
            $exe = Join-Path $dir 'piper\piper.exe'
            (Test-Path -LiteralPath $exe -PathType Leaf) -and
              ((Get-Item -LiteralPath $exe).Length -ge 100000) -and
              (Test-Path -LiteralPath (Join-Path $dir "voices\$env:VOICE") -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $dir "voices\$env:VOICE.json") -PathType Leaf)
          }
          function Save-WithRetry([string]$uri, [string]$outFile) {
            for ($attempt = 1; ; $attempt++) {
              try { Invoke-WebRequest -Uri $uri -OutFile $outFile; return }
              catch {
                if ($attempt -ge 4) { throw }
                Write-Warning "Download attempt $attempt of $uri failed: $($_.Exception.Message); retrying"
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
          }
          if (Test-PiperSet $entry) {
            Write-Host "Runner-local cache hit: $entry"
          } else {
            Write-Host "Runner-local cache miss: $entry"
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            # Only this workflow writes under $root: drop leftovers of an
            # interrupted fill and entries for older keys.
            Get-ChildItem -LiteralPath $root -Directory | Remove-Item -Recurse -Force
            $stage = Join-Path $root "$key.partial-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'voices') | Out-Null
            $zip = Join-Path $stage 'piper.zip'
            Save-WithRetry "https://github.com/rhasspy/piper/releases/download/$env:PIPER_VERSION/piper_windows_amd64.zip" $zip
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            Remove-Item -LiteralPath $zip
            # Same URL pattern as the in-app Voice Manager builds
            $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/$env:VOICE_NAME/$env:VOICE_QUALITY"
            Save-WithRetry "$base/$env:VOICE" (Join-Path $stage "voices\$env:VOICE")
            Save-WithRetry "$base/$env:VOICE.json" (Join-Path $stage "voices\$env:VOICE.json")
            if (-not (Test-PiperSet $stage)) { throw "Downloaded piper/voice set is incomplete: $stage" }
            Move-Item -LiteralPath $stage -Destination $entry
          }
          Get-ChildItem -LiteralPath (Join-Path $entry 'voices') | Select-Object Name, Length
          "PIPPAL_PIPER_EXE=$(Join-Path $entry 'piper\piper.exe')" >> $env:GITHUB_ENV
          "PIPPAL_VOICE_DIR=$(Join-Path $entry 'voices')" >> $env:GITHUB_ENV

      - name: Create job venv + install package + dev extras + faster-whisper
        # Fresh per-job venv; see the install-surface-smoke job.
        shell: pwsh
        run: |
          python -m venv --clear .venv-ci-e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $PWD '.venv-ci-e2e\Scripts\python.exe'
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install faster-whisper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PIPPAL_CI_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Run E2E suite
        shell: pwsh
        # PIPPAL_PIPER_EXE / PIPPAL_VOICE_DIR come from the runner-local
        # cache restore step (GITHUB_ENV).
        env:
          PIPPAL_TEST_VOICE: ${{ env.VOICE }}
        run: |
          & $env:PIPPAL_CI_PYTHON -m pytest tests/e2e -v -m e2e | Tee-Object -FilePath e2e-output.txt

      - name: Format E2E comment
        if: always() && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $icon = if ('${{ job.status }}' -eq 'success') { '✅' } else { '❌' }
          @(
            "### $icon E2E (synth pipeline) — ``$($env:GITHUB_SHA.Substring(0,7))``"
            ""
            "<details><summary>pytest output (tail)</summary>"
            ""
            '```'
            (Get-Content e2e-output.txt -Tail 60 -ErrorAction SilentlyContinue)
            '```'
            ""
            "</details>"
          ) | Out-File -FilePath e2e-comment.md -Encoding utf8

      - name: Find prior E2E comment
        if: always() && github.event_name == 'pull_request'
        id: find-e2e
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "E2E (synth pipeline)"

      - name: Comment E2E result on PR
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-e2e.outputs.comment-id }}
          body-path: e2e-comment.md
          edit-mode: replace
